[project]
name = "ai-agent-thunderdome"
version = "0.1.0"
description = "A single-pane Textual arena for referee-verified model chess matches"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alcf-tokens>=0.4.0",
  "chess>=1.11.2",
  "textual>=6.0",
]

[project.scripts]
thunderdome = "arcade_cli.thunderdome:main"
arcade = "arcade_cli.main:main"
thunderdome-series = "arcade_cli.series:main"

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli/src/arcade_cli"]

[tool.hatch.build.targets.wheel.force-include]
"engine" = "arcade_cli/_engine"

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
