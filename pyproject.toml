[project]
name = "ai-agent-arcade"
version = "0.1.1"
description = "A single-pane Textual arcade for referee-verified model chess matches"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alcf-tokens>=0.4.0",
  "chess>=1.11.2",
  "textual>=6.0",
]

[project.scripts]
arcade = "arcade_cli.main:main"
ai-agent-arcade = "arcade_cli.arcade_app:main"
ai-agent-arcade-series = "arcade_cli.series:main"

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli/src/arcade_cli"]

[tool.hatch.build.targets.wheel.force-include]
"engine" = "arcade_cli/_engine"

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
